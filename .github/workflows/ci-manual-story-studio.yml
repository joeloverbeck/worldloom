name: CI - manual-story-studio

on:
  push:
    branches: [main]
    paths:
      - 'tools/manual-story-studio/**'
      - '.github/workflows/ci-manual-story-studio.yml'
  pull_request:
    paths:
      - 'tools/manual-story-studio/**'
      - '.github/workflows/ci-manual-story-studio.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install
        working-directory: tools/manual-story-studio
        run: npm install
      - name: Install web subpackage
        working-directory: tools/manual-story-studio
        run: npm --prefix web install --no-audit --no-fund
      - name: Test
        working-directory: tools/manual-story-studio
        run: npm test
