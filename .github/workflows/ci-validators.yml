name: CI - validators

on:
  push:
    branches: [main]
    paths:
      - 'tools/validators/**'
      - 'tools/patch-engine/**'
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-validators.yml'
  pull_request:
    paths:
      - 'tools/validators/**'
      - 'tools/patch-engine/**'
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-validators.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install and build world-index (file dependency)
        working-directory: tools/world-index
        run: npm install && npm run build
      - name: Install and build patch-engine (file dependency)
        working-directory: tools/patch-engine
        run: npm install && npm run build
      - name: Install
        working-directory: tools/validators
        run: npm install
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Lint fixture ID padding
        run: bash tools/validators/scripts/check-fixture-id-padding.sh
      - name: Lint archive-citation discipline
        run: bash tools/validators/scripts/check-archive-citation-discipline.sh
      - name: Test
        working-directory: tools/validators
        run: npm test
