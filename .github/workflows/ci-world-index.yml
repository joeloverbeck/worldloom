name: CI - world-index

on:
  push:
    branches: [main]
    paths:
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-world-index.yml'
  pull_request:
    paths:
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-world-index.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        working-directory: tools/world-index
        run: npm install
      - name: Build
        working-directory: tools/world-index
        run: npm run build
      - name: Test
        working-directory: tools/world-index
        run: npm test
      - name: SPEC-10 verification
        working-directory: tools/world-index
        run: npm run test:spec10-verification
