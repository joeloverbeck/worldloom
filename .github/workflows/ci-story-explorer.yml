name: CI - story-explorer

on:
  push:
    branches: [main]
    paths:
      - 'tools/story-explorer/**'
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-story-explorer.yml'
  pull_request:
    paths:
      - 'tools/story-explorer/**'
      - 'tools/world-index/**'
      - 'tests/fixtures/animalia/**'
      - '.github/workflows/ci-story-explorer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install and build world-index (file dependency)
        working-directory: tools/world-index
        run: npm install && npm run build
      - name: Install
        working-directory: tools/story-explorer
        run: npm install
      - name: Test
        working-directory: tools/story-explorer
        run: npm test
