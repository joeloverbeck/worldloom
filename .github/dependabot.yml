version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/world-index
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      world-index-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/patch-engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-engine-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/validators
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      validators-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/hooks
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      hooks-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/world-mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      world-mcp-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
