# Story records — schema reference for branching-story-bootstrap
#
# One YAML document per record class. Each document carries the required +
# optional field enumeration with example values. Phase 11 emits one file per
# record under worlds/<world-slug>/stories/<story-slug>/_source/<class>/<id>.yaml.
#
# Conventions:
#   - All ids are story-scoped (e.g. STENT-0001 in story A and story B do not collide).
#   - All record schemas declare `story_id` so a record can be traced to its bundle.
#   - All non-PG branch-scoped emergent records carry `created_at_page` (a PG-id
#     at which the record entered branch state). PG records are pages; their own
#     `id` is the branch anchor and must appear in `branch_path`. Author-pool
#     storylets are the other exception: `created_at_page: null` marks them
#     globally legal across all branches.
#   - All `*_id` lists are bare ids (e.g. `[STENT-0001, STENT-0003]`) — no
#     prose mixed in.
#
# Bootstrap-time defaults — at PG-0001 the runtime is at tick 0:
#   - paid-off / addressed / archived collections are []
#   - novelty: 1.0; causal_connectivity: 1.0; agency_score: 1.0
#   - average_obligation_age: 0; recent_consequence_density: 0.0
#   - parent_state_hash: null; state_hash_before: null
---
# STENT-NNNN — Story Entity (mirror of world ENT or story-only)

id: STENT-0001
story_id: STORY-0001
world_ent_id: null                       # null for character mirrors AND for story-only entities; populated only when the STENT mirrors a world-level ENT-NNNN named-entity record from worlds/<slug>/_source/entities/. Genesis ENT registries cover places / polities / geography / peoples clusters — CHARs are hybrid character records, NOT atomic ENTs, so STENTs whose character_id is set ALWAYS take world_ent_id: null.
character_id: CHAR-0007                  # null for non-CHAR entities
name: ""
role_in_story: protagonist               # protagonist | major | supporting | antagonist | foil
present_at_start: true
intention_snapshot_id: STINT-0001   # null for non-driving entities; bare-numeric per engine `^STINT-\d{4}$`; per-character STINTs are distinguished by the STINT record's stent_id field (the story entity it drives), not by id suffix; bootstrap-time pointer only — runtime page-cycle intention_refresh creates new STINTs via supersession without updating this field, so post-bootstrap consumers MUST read active intentions from `PG.state_snapshot.intentions_current` (per `branching-story-page-cycle/references/phase-5-state-mutation.md §intention_refresh`)
story_only: false                        # true if invented for this story; promotion is story-fact-promotion-to-canon's job
created_at_page: PG-0001
notes: >
  Free-form notes carrying material reality, institutional embedding, and
  voice-and-perception summaries lifted from the world dossier.
---
# STINT-NNNN — Character Intention Snapshot (bare-numeric id; stent_id points to the story entity this snapshot drives; world_character_id is the world CHAR anchor or null for story-only cast)

id: STINT-0001
story_id: STORY-0001
stent_id: STENT-0001
world_character_id: CHAR-0007            # null for story-only cast
goals: []                                # what this character is actively trying to do
fears: []                                # what they actively avoid
secrets: []                              # SF-NNNN ids — facts they alone know (or know in a small circle)
beliefs: []                              # SF-NNNN ids — facts they hold as true (may be wrong; epistemic_class: belief)
relationships: {}                        # { STENT-id: <relationship state> }
emotional_state: {}
current_pressure: 0                      # 0..10
traits: []
values: {}                               # { value_axis: weight }
created_at_page: PG-0001
notes: >
  ...
---
# SF-NNNN — Story-Local Fact
#
# Reader visibility defaults to false. Set `visible_to_reader: true` only with
# a positive `reader_visibility_basis` (one of: shown_in_pg0001, known_to_pov,
# dramatic_irony, diegetic_artifact_visible). Use
# `unrevealed_objective_truth` when `visible_to_reader: false`.

id: SF-0001
story_id: STORY-0001
logical_id: SF-0001                      # logical id stays stable when the SF is superseded
supersedes: null                         # SF-NNNN id this supersedes (runtime-page-cycle concern; null at bootstrap)
created_at_page: PG-0001

subject: STENT-0001                      # STENT | STOBJ | STLOC | "abstract"
predicate: ""                            # engine-checkable predicate
object: ""                               # value

epistemic_class: objective               # objective | belief | rumor | reader_inference | apparent | disputed
truth_value: true                        # true | false | unknown | contested
certainty: 1.0                           # 0.0..1.0

known_by: []                             # STENT ids
believed_by: []                          # for belief / apparent class
disbelieved_by: []
visible_to_reader: false
reader_visibility_basis: unrevealed_objective_truth   # shown_in_pg0001 | known_to_pov | dramatic_irony | diegetic_artifact_visible | unrevealed_objective_truth

derived_from_cf: CF-0042                 # null for premise-specific facts
canon_relation: canon_consistent         # canon_consistent | canon_divergent | canon_unknown | not_applicable

evidence:
  - event_id: SE-0001
    page_id: PG-0001
    strength: weak                       # weak | moderate | strong | decisive

notes: >
  ...
---
# SE-NNNN — Story Event (bootstrap genesis example; schema authority is branching-story-page-cycle)

id: SE-0001
story_id: STORY-0001
branch_id: BR-0001
created_at_page: PG-0001

source:
  parent_page_id: null                   # null at genesis
  chosen_choice_id: null                 # no prior choice
  write_in_text_hash: null
  storylet_realized: null                # null at PG-0001 root only (bootstrap genesis SE; PG-0001 has no SLT realized)

actor: system                            # STENT-NNNN | system | environment
action: bootstrap                        # canonical verb
target: null                             # STENT-NNNN | STOBJ-NNNN | STLOC-NNNN | abstract | null
instrument: null                         # STENT-NNNN | STOBJ-NNNN | SF-NNNN | null

preconditions_checked: []                # no preconditions for genesis

ops: []                                  # no event ops fire at genesis; PG-0001.state_snapshot is the bedrock

state_hash_before: null                  # null at bootstrap
state_hash_after: ""                     # PG-0001.state_hash at bootstrap

notes: >
  Genesis event for STORY-0001 — bootstrap emission, no preceding state.
---
# OBL-NNNN — Obligation Ledger Entry

id: OBL-0001
story_id: STORY-0001
type: ""                                 # mystery | foreshadowed_object | threat | relationship_tension | secret | moral_debt | quest | motif | prophecy | character_goal | reader_expectation
introduced_at_event: SE-0001
introduced_at_page: PG-0001
owner: STENT-0001                        # null for ownerless reader-expectation obligations
subjects: []                             # STENT ids
visible_to_reader: true
known_by: []                             # STENT ids — actors aware of the obligation
salience: 5                              # 0..10 — REQUIRED at bootstrap
urgency: 5                               # 0..10 — REQUIRED at bootstrap
emotional_weight: 5                      # 0..10
decay_rate: 0.0                          # 0..1 per page tick
required_closure: false
possible_payoff_modes:                   # ≥2 REQUIRED at bootstrap (Rule 5 halt rule)
  - literal_fulfillment
  - ironic_reversal
  # Other valid modes: failed_expectation | symbolic_echo | transfer | red_herring | tragic_loss | abandon_with_acknowledgment
constraints: []                          # predicate strings
dependent_facts: []                      # SF ids
coverage_cache:                          # advisory only — runtime recomputes against current branch
  compatible_storylets: []               # SLT ids
  checked_at_page: null
  checked_at_storylet_pool_hash: null
status: open                             # open | paid_off | abandoned | failed
notes: >
  ...
---
# CNSQ-NNNN — Persisted Consequence (conditional at bootstrap; runtime usually populates)

id: CNSQ-0001
story_id: STORY-0001
type: ""                                 # body_discovery | rumor_wave | faction_reaction | grief_state | physical_injury | reputation_shift | etc
introduced_at_event: SE-NNNN
introduced_at_page: PG-NNNN
subjects: []                             # STENT ids
salience: 5                              # 0..10
visible_to_reader: true
addressed_at_page: null                  # null until runtime addresses
addressed_at_event: null
notes: >
  ...
---
# THR-NNNN — Live Narrative Thread

id: THR-0001
story_id: STORY-0001
type: ""                                 # mystery | relationship | threat | quest | theme | survival
status: active                           # dormant | active | pressured | critical | resolved | failed
title: ""
owner_cast: []                           # STENT ids
obligations: []                          # OBL ids
current_pressure: 5                      # 0..10
desired_cadence: 5                       # 0..10 — how often runtime should attend to this thread
created_at_page: PG-0001
notes: >
  ...
---
# SREL-NNNN — Story Relationship State (between two STENTs)

id: SREL-0001
story_id: STORY-0001
participants:                            # exactly 2 STENT ids; canonical sort order by lexical id
  - STENT-0001
  - STENT-0002
relation_type: ""                        # parent | sibling | lover | friend | rival | mentor | enemy | ally | etc — extensible
trust: 5                                 # 0..10
intimacy: 5                              # 0..10
power_balance: 0                         # -10..10 (negative = first participant subordinate)
visible_to_reader: true
known_by: []                             # STENT ids — third parties aware of the relation
last_meaningful_interaction: null        # PG-NNNN — null at bootstrap
created_at_page: PG-0001
notes: >
  ...
---
# SLT-NNNN — Storylet records are produced by storylet-pool-authoring (delegated from
# Phase 6) and conform to .claude/skills/storylet-pool-authoring/templates/storylet-record.yaml.
# Bootstrap's Phase 11 staged commit writes the delegated batch's SLT files into
# _source/storylets/ through the engine YAML transaction subset. The storylet-pool-authoring
# template is the single source of truth.
---
# STLOC-NNNN — Story-Local Location

id: STLOC-0001
story_id: STORY-0001
world_geo_anchor: SEC-GEO-NNN            # null for story-only locations
parent_location: null                    # STLOC-id for nested locations
name: ""
description: >
  ...
accessible_from: []                      # STLOC ids
present_objects: []                      # STOBJ ids
ambient_facts: []                        # SF ids — facts that hold ambiently in this location
created_at_page: PG-0001
notes: >
  ...
---
# STOBJ-NNNN — Story-Local Object / Instrument

id: STOBJ-0001
story_id: STORY-0001
world_artifact_anchor: null              # CF-id for world-canonical artifacts; null for story-only
type: ""                                 # weapon | tool | document | ritual_object | clothing | currency | medicine | drug | etc
name: ""
description: >
  ...
current_location: STLOC-0001             # STLOC-id; null if held by an entity (use inventory_by_entity instead)
current_holder: null                     # STENT-id; null if at-location
properties: {}                           # free-form mechanical properties
created_at_page: PG-0001
notes: >
  ...
---
# DA-NNNN — Story-Local Diegetic Artifact (letter, decree, recording, relic, etc)

id: DA-0001
story_id: STORY-0001                     # delta from world-level DA: story_id added
world_da_anchor: null                    # DA-id from worlds/<slug>/diegetic-artifacts/ if mirrored; null for story-only
artifact_type: ""                        # letter | decree | recording | relic | journal_entry | broadside | confession | etc
title: ""
in_world_author: STENT-0001              # null for anonymous / unknown
in_world_date: ""
truth_register: ""                       # accurate | propagandistic | misremembered | forged | partial | etc
content: >
  Verbatim diegetic content. Treated as a voice from within the story; NOT
  world-level canon. Promotion to world-level DA is story-fact-promotion-to-canon's
  job. (See worlds/<slug>/diegetic-artifacts/ for the world-DA frontmatter
  shape this template inherits from — story-local DAs carry an additional
  story_id field and a world_da_anchor pointer.)
known_by: []                             # STENT ids
created_at_page: PG-0001
notes: >
  ...
---
# BR-NNNN — Branch (bootstrap creates BR-0001 only; runtime forks allocate further BRs)

id: BR-0001
story_id: STORY-0001
root_page_id: PG-0001
current_leaf_page_id: PG-0001

forked_from_branch_id: null
forked_from_page_id: null
forked_from_choice_id: null
forked_from_write_in_hash: null

branch_path: [PG-0001]
status: active                           # active | terminal | archived | corrupt | contradicted_by_promoted_canon
canon_revision: null                     # CH-id visible at branch root; null if world has no CH yet

created_at_page: PG-0001
created_at: <iso8601>
notes: "Root branch."
---
# PG-NNNN — Page Record (bootstrap creates PG-0001 only)

id: PG-0001
story_id: STORY-0001
branch_id: BR-0001
parent_page_id: null
branch_path: [PG-0001]
chosen_choice_id: null                   # null for root page
write_in_used: false                     # true if Path B was the route
write_in_routing: null                   # null | accept | accept_but_transform | treat_as_attempt | refuse_only_through_world_logic

storylet_realized: null                  # null at PG-0001 root only — bootstrap genesis is a scene-setter without an SLT realized; non-root pages set this to the SLT id realized this turn (per references/phase-7-root-page-render.md §Emit PG-0001 record)
applied_event_ops: [SE-0001]

state_hash: ""
parent_state_hash: null

branch_terminal: false
terminal_reason: null

state_snapshot:
  canon_revision: null                   # CH-id; null if world has no CH yet
  objective_facts: []                    # SF ids with epistemic_class: objective
  apparent_facts: []                     # SF ids with epistemic_class: apparent
  disputed_facts: []                     # SF ids with epistemic_class: disputed
  reader_known_facts: []                 # SF ids with visible_to_reader: true
  belief_state_by_actor: {}              # { STENT-id: [SF-id, ...] } — beliefs held by this actor
  rumor_state: []                        # SF ids with epistemic_class: rumor
  obligations_open: []                   # OBL ids
  obligations_paid_off: []               # [] at bootstrap
  obligations_complicated: []            # [] at bootstrap
  obligations_abandoned: []              # [] at bootstrap
  consequences_pending: []               # CNSQ ids
  consequences_addressed: []             # [] at bootstrap
  threads_active: []                     # THR ids
  relationships_current: []              # SREL ids
  intentions_current: []                 # STINT ids — include EVERY bound cast member's STINT (including offstage characters whose intentions persist across pages while they are not in cast_present); the runtime page-cycle filters to physically-present cast at evaluation time when computing character_motivation_coverage. Bootstrap-time PG-0001 lists every STINT created in Phase 2.
  cast_present: []                       # STENT ids physically present
  current_location: STLOC-0001
  accessible_locations: []               # STLOC ids
  objects_in_scope: []                   # STOBJ ids
  inventory_by_entity: {}                # { STENT-id: [STOBJ-id, ...] }
  entity_status: {}                      # { STENT-id: { alive, conscious, present, mobile, restrained } }
  applied_effect_variant: null           # PG-0001 root special case; bootstrap is a scene-setter, no arc closes here (per phase-9-validation-gates.md gate 14)
  narrative_point_classification: NATURAL_COMMITMENT_HINGE   # PG-0001 default per phase-9-validation-gates.md gate 16; closed enum from page-cycle Phase 8 narrative-point classification
  arc_trace_id: null                     # PG-0001 emits no ARC_TRACE (no arc); phase-9-validation-gates.md gate 15 root-special-case
  arc_trace_emitted: false               # paired with arc_trace_id: null at PG-0001

prose_plan_path: pages-prose-plans/PG-0001.md  # always present after bundle commit; bootstrap writes this file at Phase 11 step 4
prose_path: null                         # null at bundle commit (no rendered prose yet); populated by branching-story-page-prose-finalize when the user supplies pages-prose/PG-0001.md; pattern after finalize: pages-prose/PG-NNNN.md
prose_status: pending                    # pending | rendered | superseded — default pending at bundle commit; flips to rendered by branching-story-page-prose-finalize; flips to superseded only if a subsequent re-render via finalize replaces a prior rendered prose file
deferred_validation_trace:               # three keys REQUIRED; each DEFERRED at bundle commit; PASS/FAIL after finalize Phase 5
  prose_ledger_consistency: "DEFERRED — awaiting prose render"
  arc_trace_evidence_alignment: "DEFERRED — awaiting prose render"   # at PG-0001 root this gate also AUTO-PASSes on validation_trace (no arc selected); deferred_validation_trace still records the DEFERRED placeholder until finalize runs
  prose_critic_8_axis: "DEFERRED — awaiting prose render"
emitted_choices: []                      # CHC ids — populated at Phase 8

narrative_health:
  open_obligation_count: 0
  high_salience_unpaid_count: 0          # count of OBLs with status == open AND salience >= 7; Phase 8 choice-surface composition treats high-salience obligations as candidate exit sources
  average_obligation_age: 0
  contradiction_risk: 0.0
  causal_connectivity: 1.0
  character_motivation_coverage: 0.0     # 0..1
  unresolved_threat_pressure: 0.0        # 0..1
  recent_consequence_density: 0.0
  recent_reflection_density: 0.0
  novelty: 1.0
  tension: 0.0                           # 0..1
  agency_score: 1.0

governor_nudge_applied: "bootstrap root; no prior-page governor"
content_intensity: mature                # tame | mature | explicit
validation_trace:                        # PG-0001 records the page-cycle 12 PG-record keys (per phase-7-root-page-plan.md §Phase 9 dual-validation-trace mapping) plus the 5 scene-commitment validator gates plus the plan_completeness_check key — 18 PG-record keys total per phase-7-root-page-plan.md §Emit PG-0001 record
  mystery_firewall: PASS —<rationale>
  invariant_compatibility: PASS —<rationale>
  recursive_reference_closure: PASS —<rationale>
  snapshot_replay_equality: PASS —<rationale>
  id_uniqueness: PASS —<rationale>
  content_policy_presence: PASS —<rationale>
  prose_ledger_consistency: PASS —<rationale>
  choice_contract_integrity: PASS —<rationale>
  choice_consequence_capacity: PASS —<rationale>
  state_snapshot_integrity: PASS —<rationale>
  epistemic_class_declared: PASS —<rationale>
  consequence_persistence: PASS —<rationale>
  arc_envelope_conformance: PASS —PG-0001 root special case, no arc selected
  effect_model_replay_safety: PASS —PG-0001 root special case, applied_effect_variant null
  arc_trace_evidence_alignment: PASS —PG-0001 root special case, no ARC_TRACE emitted
  narrative_point_classification: PASS —PG-0001 defaults to NATURAL_COMMITMENT_HINGE
  choice_worthiness_completeness: PASS —every emitted PG-0001 CHC passes Phase 8 choice-worthiness validation
  plan_completeness_check: PASS —<rationale>
created_at: <iso8601>
---
# CHC-NNNN — Choice (4-6 emitted at PG-0001; write-in slot is N+1 at runtime)

id: CHC-0001
story_id: STORY-0001
emitted_at_page: PG-0001
created_at_page: PG-0001

operation: investigate                   # canonical verb from Phase 8 affordance vocabulary
actor: STENT-0001
target: STENT-NNNN                        # STENT-NNNN | STOBJ-NNNN | STLOC-NNNN | abstract
uses_fact: null                           # SF-NNNN | null

choice_contract:
  user_intent: >
    What the player is signaling they want to accomplish.
  guaranteed_action: >
    What WILL definitely be attempted or performed if this choice is selected.
  success_policy: guaranteed             # guaranteed | attempted | uncertain | opposed — choice-level transaction success; distinct from SLT.arc_contract.success_policy (commitment-level: uncontested | contested | costly | uncertain)
  allowed_outcome_band:
    - succeeds
    - partially_succeeds
    - fails_with_consequence
    - backfires
  forbidden_outcomes:
    - <outcome that would betray the label>
  minimum_state_change:
    - fact                              # fact | obligation | consequence | relationship | intention | thread | location | cast | terminality

likely_effects: []                       # structured effect sketches; runtime validates before commit
continuation_capacity:
  post_choice_delta:
    facts_added_or_changed: []           # SF-NNNN ids changed by minimum_state_change / likely_effects
    obligations_changed: []              # OBL-NNNN ids whose status or salience would shift
    location_changed: null               # null if no move; STLOC-NNNN id if current_location changes
    cast_present_changed: []             # STENT-NNNN ids entering or leaving cast_present
    mystery_resolution_risk: []          # M-NNNN ids whose safety status the post-choice state tests
  valid_seed_storylets: []               # SLT-NNNN ids whose hard_preconds/cast/location/mystery checks pass under the post-choice delta
  jit_shape_spec: null                   # one-line JIT continuation sketch when no seed SLT matches
  validation_basis: ""                   # one-line rationale for the accepted seed or JIT continuation path
choice_mode: thread_engagement           # e.g. moral | strategic | emotional | investigative | risky | self_protective
poetic_effect: obvious                   # e.g. relaxed | obvious | dilemma | risky_truth | sacrifice | seduction | desperation | revelation
content_intensity_implied: mature        # tame | mature | explicit
label: ""                                # user-facing prose ("Confront the magistrate", "Walk away", etc.)
