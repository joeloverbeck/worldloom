# Storylet Record — template (SLT-NNNN)
#
# Matches SPEC-19 §A: Storylet Record (SLT). A storylet is a
# scene-commitment arc, not a single beat. The required discriminants are
# record_version: 2 and shape: scene_commitment_arc.
#
# Engine consumer (branching-story-page-cycle Phase 4 selection) reads:
# visibility, hard_preconds, soft_preconds, mystery_safety,
# M_resolution_claims, provenance, content_intensity. SPEC-20 adds
# arc-aware Phase 4 logic for the seven structural blocks below.
#
# Required structural fields:
#   id, story_id, title, record_version, shape, content_intensity,
#   hard_preconds, soft_preconds, cast_requirements, location_requirements,
#   opens_obligations, pays_off_obligations, complicates_obligations,
#   transfers_obligations, fact_effects, relationship_effects,
#   tone_tags, theme_tags, tension_delta, aftermath_weight,
#   mystery_safety (with all sub-fields),
#   provenance (with all sub-fields), visibility (with scope + scoping fields),
#   arc_contract, dramatic_unit, beat_plan, execution_envelope, stop_policy,
#   effect_model, exit_portfolio.
#
# choice_templates is forbidden. Its presence on an SLT is HARD-REJECTed
# by SPEC-22's arc_schema_compliance validator; runtime choice proposal
# scaffolding moves to exit_portfolio.native_seeds.
#
# A record missing any of those violates Rule 1 (No Floating Facts) and is
# HARD-REJECTed at Phase 4 gate 9.

record_version: 2                          # current schema version per SPEC-19 §A
id: SLT-0019                               # per-story append-only; allocated via allocate_next_id(world_slug, 'SLT', story_slug=...)
story_id: STORY-0001                       # the parent story bundle's STORY-NNNN
title: ""                                  # short human label
shape: scene_commitment_arc                # only legal value (see SPEC-19 §A)
content_intensity: mature                  # tame | mature | explicit (must be within STORY_KERNEL.content_intensity_baseline ± 1 band; gate 6)

# Engine-facing structural fields — predicates per templates/predicate-dsl.md.
# Phase 4 gate 7 HARD-REJECTs storylets whose predicates do not parse against the DSL.

hard_preconds:                             # MUST be true for storylet to be eligible
  - {pred: ...}                            # see templates/predicate-dsl.md
soft_preconds:                             # contribute to score, not to eligibility
  - {pred: ..., weight: 1.0}
cast_requirements:                         # roles or STENTs the storylet needs present
  - {role: protagonist, predicates: [{pred: entity_state, entity: role:protagonist, property: present, op: ==, value: true}]}
location_requirements:
  - {pred: ...}                            # optional; empty list permitted

# Obligation interactions (engine instantiates obligation_template at apply time)
#
# OBLIGATION MATCHER SCHEMA — used by pays_off_obligations, complicates_obligations,
# and the obligation_matcher sub-field of transfers_obligations. Allowed keys:
#   id                — exact OBL-NNNN id match
#   type              — OBL type literal (secret | reader_expectation |
#                       relationship_tension | motif | character_goal |
#                       foreshadowed_object | moral_debt | ...)
#   owner             — STENT-NNNN id or role:<role> matcher binding owner field
#   subjects          — list of STENT-NNNN ids or role-matchers; matches OBLs whose
#                       subjects array contains all listed entries (logical AND)
#   salience_min      — integer 0..10; matches OBLs with salience >= value
#   urgency_min       — integer 0..10; matches OBLs with urgency >= value
#   status            — open | paid_off | complicated | abandoned
#   payoff_mode_filter — list of payoff-mode strings (literal_fulfillment |
#                        ironic_reversal | failed_expectation | symbolic_echo |
#                        transfer | red_herring | tragic_loss |
#                        abandon_with_acknowledgment); REQUIRED when an OBL has
#                        multiple possible_payoff_modes and the storylet claims
#                        to pay off the OBL via a specific subset
#
# A single matcher may combine multiple keys; all listed keys must match (AND).
# Full schema documented in templates/predicate-dsl.md §Obligation matcher schema.

opens_obligations: []                      # new OBLs the storylet opens — each is an obligation_template (type, owner, salience_min, etc.)
pays_off_obligations: []                   # OBL field-matchers; matching open OBLs are paid off when the storylet realizes
                                           # Worked example:
                                           # - {obligation_id_matcher: {id: OBL-0006, payoff_mode_filter: [literal_fulfillment]}}
                                           # - {obligation_id_matcher: {type: secret, owner: role:antagonist, status: open, payoff_mode_filter: [ironic_reversal]}}
complicates_obligations: []                # OBL field-matchers + delta fields; matching open OBLs are complicated by the listed deltas
                                           # Worked example:
                                           # - {obligation_id_matcher: {id: OBL-0002}, salience_delta: +2, urgency_delta: +1}
                                           # - {obligation_id_matcher: {type: relationship_tension, status: open}, urgency_delta: +1}
transfers_obligations: []                  # {from_owner, to_owner_pattern, obligation_matcher} entries
                                           # Worked example:
                                           # - {from_owner: role:antagonist, to_owner_pattern: role:cuadrilla_member, obligation_matcher: {type: secret, status: open}}

# Fact + relationship effects (structured ops; free-form prose is gate-9 rejected).
# fact_effects and relationship_effects are default per-arc effect
# packages; authors may inline-promote them into a single-variant effect_model
# if the arc has no outcome non-determinism.

fact_effects:                              # one entry per fact created or invalidated
  # fact_template includes epistemic_class, visible_to_reader, and
  # reader_visibility_basis. Default new SFs to visible_to_reader: false with
  # reader_visibility_basis: unrevealed_objective_truth. If visible_to_reader is
  # true, reader_visibility_basis must be one of shown_in_pg0001, known_to_pov,
  # dramatic_irony, or diegetic_artifact_visible.
  - {op: create, fact_template: {...}}
  # - {op: invalidate, fact_id_matcher: {...}}

relationship_effects:                      # produce superseding SREL records, not loose deltas
  - {from: role:protagonist, to: role:antagonist,
     axes_delta: {trust: -2, fear: +1},
     public_status_change: null,
     source_event: SE-template}

# Tone / theme tagging + aggregate signals

tone_tags: []                              # arbitrary tags — Phase 5 diversity audit checks no tag exceeds 40%
theme_tags: []                             # Phase 5 diversity audit checks no theme exceeds 50%
tension_delta: 0                           # -2..+2 — runtime governor reads this
aftermath_weight: 0.0                      # 0.0..1.0 — runtime narrative-health uses this for recent_consequence_density

# Mystery safety + resolution authority — MANDATORY (Phase 4 gates 1 + 2)

mystery_safety:
  forbidden_M_resolved: false              # MUST be false; Phase 4 gate 1 hard-rejects true
  M_touched: []                            # M-NNNN ids the storylet brushes (no resolution claimed)
  M_progressed: []                         # M-NNNN ids advanced (clue / partial reveal) without resolution
  M_resolution_claims: []                  # one entry per M the storylet claims authority to resolve
    # - m_id: M-NNNN
    #   resolution_authority: apparent | branch_local_counterfactual | canon_candidate
    #   claim_strength: clue | theory | confession | proof | objective_event
    #   requires_canon_promotion: false    # MUST be true iff resolution_authority == canon_candidate (gate 2)
  resolution_safety_per_M: {}              # M-NNNN -> forbidden | low | medium | high — must match the M record's actual future_resolution_safety (gate 2)

# choice_templates — forbidden. The runtime LLM proposer no longer reads choice scaffolds
# from SLT records; that role moves to exit_portfolio.native_seeds (see arc_contract below).
# Presence of choice_templates is HARD-REJECTed by SPEC-22's arc_schema_compliance.

# Provenance — load-bearing for branch-isolation + audit trail

provenance:
  origin: focus_authoring                  # bootstrap_seed | focus_authoring | audit_remediation | runtime_jit
  source_audit: null                       # SAU-NNNN if origin == audit_remediation, else null
  source_rsp: null                         # RSP-NNNN if origin == audit_remediation, else null
  created_at_page: null                    # null for global_author_pool storylets; PG-NNNN for branch-scoped runtime-JIT storylets

# Visibility — load-bearing for branch-isolation (Phase 4 gate 8 + Phase 5 batch-level)

visibility:
  scope: global_author_pool                # global_author_pool | branch_prefix_scoped | branch_scoped
  visible_from_page: null                  # PG-NNNN — required when scope == branch_prefix_scoped
  visible_branch_path_prefix: null         # [PG-NNNN, ...] — required when scope == branch_prefix_scoped
  allowed_branch_ids: null                 # [BR-NNNN, ...] — optional explicit allowlist

arc_contract:                              # what the user committed to; mirrors selected CHC
  commitment_class: <commitment_class enum> # closed enum — see canonical-vocabularies
  arc_archetype: <arc_archetype label>     # orienting pattern label; prefer library values when they fit, but story-specific snake_case values are allowed
  actor: STENT-NNNN                        # STENT-NNNN | role:<role>
  target: null                             # STENT-NNNN | role:<role> | null
  user_intent: >                           # user-side commitment encoded by this arc
    Free-form prose; reused verbatim if the arc is the chosen commitment from
    a CHC whose choice_contract.user_intent matches.
  strategic_question_answered: >           # what the arc answers, in scene-question form
    Free-form prose.
  commitment_scope: scene                  # scene | sequence; default: scene
  success_policy: contested                # uncontested | contested | costly | uncertain — arc-level commitment success; distinct from CHC.choice_contract.success_policy (transaction-level: guaranteed | attempted | uncertain | opposed)
  allowed_outcome_band:                    # closed enum — see canonical-vocabularies §strong_outcome
    - <strong_outcome enum value>

dramatic_unit:                             # why this arc is a scene-level unit
  scene_question: >                        # yes/no or alternative dramatic question
    Free-form prose.
  entry_pressure:
    thread: null                           # THR-NNNN | null
    description: >                         # what is unstable on entry
      Free-form prose.
  value_delta_target:                      # what changes when the arc closes successfully
    relationship:                          # optional
      axis: <relationship axis enum>
      direction: increase_small            # increase_small | decrease_small | increase_large | decrease_large | stabilize
    thread_pressure:                       # optional
      id: THR-NNNN
      direction: increase                  # increase | decrease | stabilize
    obligation:                            # optional
      delta: complicated                   # created | accepted | deferred | refused | discharged | complicated
    information_posture:                   # optional
      delta: revealed                      # revealed | concealed | investigated | misdirected | confessed | tested
  natural_close_definition: >
    Prose description of the conditions under which the arc has played out
    and the next commitment hinge is exposed.

beat_plan:
  mode: ordered_soft                       # only supported value currently; future modes may add branchy_dag
  min_beats: <int 2..6>
  max_beats: <int 3..8>
  beats:                                   # 3-8 entries
    - id: B1
      function: <beat_function string>     # open-vocab kebab-case; see references/beat-functions.md
      realization_target: realizes-initial-scene-movement # REQUIRED; open-vocab kebab-case scene movement this beat realizes
      required: true
      state_significance: none             # none | <strong_axis enum>
    - id: B2
      function: <beat_function string>
      realization_target: realizes-turning-scene-movement
      required: true
      state_significance: <strong_axis enum>
    - id: B3
      function: <beat_function string>
      realization_target: realizes-closing-scene-movement
      required: false
      state_significance: none

execution_envelope:                        # what governs prose render under this commitment
  invariants:                              # MUST be true throughout every beat
    - <invariant_directive kebab-case string>
  required_functions:                      # MUST occur at least once across the arc
    - <required_function kebab-case string>
  allowed_tactics:                         # MAY occur; style/blocking flexibility
    - <tactic kebab-case string>
  prohibited_actions:                      # MUST NOT occur in any beat
    - <prohibited_action kebab-case string>
  style_directives:                        # prose-craft hints; non-validator-bound
    - <style_directive kebab-case string>
  mystery_preservation:
    forbidden_resolutions:                 # M-NNNN ids whose forbidden-status must be preserved
      - M-NNNN
    allowed_claims:                        # legal resolution_authority values in this arc
      - apparent
      - branch_local_counterfactual
      - canon_candidate

stop_policy:
  normal_exits:                            # any of these closes the arc cleanly
    - id: <kebab-case stop id>
      predicate: <stop_predicate enum>     # closed-enum predicate selector (args below are open kebab-case vocabulary) — grammar in templates/predicate-dsl.md (SPEC-19); enum/validator in SPEC-22
      args: {}
  interrupt_before:                        # MUST be non-empty (>=1 entry); any of these interrupts the arc before completion
    - id: <kebab-case interrupt id>
      predicate: <interrupt_predicate enum> # from templates/predicate-dsl.md Interrupt-before predicates
      args: {}                             # type-specific args; see predicate-dsl.md per-predicate args schemas
  safety_valves:
    max_internal_beats: 6                  # default: 6; matches max_beats safety-valve
    max_words: 2200                        # default: 2200; engine-only runaway-defense ceiling (NOT a soft target; see prose-craft-contract.md Rule 11)

effect_model:
  selected_before_render: true             # MUST be true; replay-equality contract
  variants:                                # 1..N rows; runtime selects ONE at Phase 4b before render
    - id: <kebab-case variant id>
      maps_to_outcome: <strong_outcome enum> # entry from arc_contract.allowed_outcome_band
      probability_weight: <float 0..1>     # used by Phase 4b weighted pick when multi-variant
      required_effects:                    # arc-level effects applied at Phase 5 state mutation
        - type: relationship_axis_shift    # relationship_axis_shift | thread_pressure_delta | obligation_status_change | fact_create | fact_invalidate | consequence_open | consequence_address | cast_change | location_change | mystery_progress
          args: {}                         # type-specific args mirroring SE.deterministic_payload
      forbidden_effects:                   # MUST NOT happen under this variant
        - type: <effect type as above>
          args: {}

exit_portfolio:
  native_seeds:                            # arc-author-declared next-commitment options
    - id: <kebab-case seed id>
      commitment_class: <commitment_class enum>
      strategy_cluster: <kebab-case open-vocab tag>
      expected_state_delta: {}             # per-strong-axis projection
      continuation_arc_selector:
        include_tags: []                   # open-vocab arc tags
        require_arc_archetype: null        # <arc_archetype label> | null; library value or story-specific snake_case label
  engine_discovered_exit_budget:
    min: 0
    max: 2                                 # default; STORY_KERNEL.cadence_policy may override
    allowed_sources:
      - urgent_obligation
      - high_salience_thread
      - unresolved_consequence
      - user_write_in

notes: >
  Free-form authorial notes — design rationale, mystery-edge sensitivity, tone
  intent, alternate-realization considerations.

