# Canon Fact Record — CF candidate template (story-fact-promotion-to-canon)
#
# Matches docs/FOUNDATIONS.md §"Canon Fact Record Schema". This skill assembles
# the candidate at Phase 2 (CF Candidate Translation / Laundering Firewall);
# canon-addition emits the actual _source/canon/CF-NNNN.yaml via create_cf_record
# patch op on accept. The candidate's `id` field is a placeholder until
# canon-addition allocates the final id at its own Pre-flight.
#
# Schema reconciliation (Option A, per skill design): source_basis.derived_from
# holds CF id list ONLY (per FOUNDATIONS schema). The promotion provenance
# (story_slug, branch_path, source_record id, supporting_pages) does NOT inflate
# this field; it flows through the SP+CH+PA triad instead (SP-NNNN ledger +
# CH-NNNN reason/notes + PA-NNNN body_markdown Phase 0 sub-section).
#
# Do NOT remove required-structural fields:
#   id, title, status, type, statement, scope, truth_scope,
#   domains_affected, source_basis, required_world_updates
#
# A record missing any of those violates Rule 1 (No Floating Facts) and will
# be rejected by canon-addition's record_schema_compliance validator.

id: CF-<placeholder>                       # canon-addition allocates the final id at its own Pre-flight
title: ""                                  # short human label
status: hard_canon                         # hard_canon | soft_canon | contested_canon | mystery_reserve
type: ""                                   # capability | artifact | law | belief | event | institution | species | ritual | taboo | technology | resource_distribution | hidden_truth | local_anomaly | metaphysical_rule
statement: >
  Natural-language statement of the fact, derived from the source story-bundle
  record (SF / M-resolution / character-arc-outcome / artifact-canonization).
  One paragraph maximum. Must be unambiguous enough to be cited in later
  adjudication.

scope:
  geographic: local                        # local | regional | global | cosmic
  temporal: current                        # ancient | historical | current | future | cyclical
  social: public                           # restricted_group | public | elite | secret | rumor

truth_scope:
  world_level: true                        # true | uncertain (false is rare for promoted CFs — the user explicitly decided this is true)
  diegetic_status: objective               # objective | believed | disputed | propagandistic | legendary
                                           # Phase 3 enforces: small known_by → believed/disputed, not objective

domains_affected:                          # at least one — Rule 2 (No Pure Cosmetics)
  - labor                                  # extended runtime via mcp__worldloom__get_canonical_vocabulary({class: 'domain'})

prerequisites: []                          # knowledge / tools / materials / conditions needed for fact to manifest

distribution:                              # Rule 4 enforcement surface — Phase 3 checks for inflation
  who_can_do_it: []
  who_cannot_easily_do_it: []
  why_not_universal: []                    # stabilizers preventing universalization

costs_and_limits: []                       # stabilizers preventing universalization — Rule 3 (No Specialness Inflation)

visible_consequences: []                   # ordinary-life signals this fact produces — Rule 5 (No Consequence Evasion, first-order)

required_world_updates: []                 # SEC file classes whose records must be extended if this fact is accepted
                                           # canon-addition's bidirectional-pointer check enforces — Phase 14a
  # - everyday-life
  # - institutions
  # - economy-and-resources

source_basis:
  direct_user_approval: true               # ALWAYS true for promoted CFs — promotion requires explicit user decision
  derived_from: []                         # CF ID LIST ONLY (FOUNDATIONS schema — Option A reconciliation)
                                           # Promotion provenance (story / branch / source-record / pages) lives in:
                                           #   - SP-NNNN ledger (this skill, Phase 10)
                                           #   - CH-NNNN reason/notes (canon-addition, on accept)
                                           #   - PA-NNNN body_markdown Phase 0 sub-section (canon-addition)

contradiction_risk:
  hard: false
  soft: false                              # set true if Phase 5 found contradicting branches in this story

notes: >
  Promoted from story <story_slug>, branch <leaf or specified non-leaf>,
  via story-promotion SP-NNNN. Original story-local source: <source ID>.
  Branch-path provenance: <path>. Supporting pages: <PG ids>.
  Full audit trail: SP-NNNN.md + CH-NNNN.yaml + PA-NNNN-<verdict>.md.

# epistemic_profile: required when knowability is non-trivial; n_a permitted
# only with one-line rationale tied to fact-type per FOUNDATIONS §CF Schema.
epistemic_profile:
  directly_observable_by: []
  inferable_by: []
  recorded_by: []
  suppressed_by: []
  distortion_vectors: []
  propagation_channels: []
  evidence_left: []
  knowledge_exclusions: []
  # OR n_a form: n_a: "Pure geography fact promoted from environment-establishing branch; no knowability axis."

exception_governance:
  activation_conditions: []
  rate_limits: []
  mobility_limits: []
  diffusion_barriers: []
  countermeasures: []
  nondeployment_reasons: []
  # OR n_a form: n_a: "Structural-institutional fact; no exception axis."

pre_figured_by: []                          # CF IDs ONLY — earlier accepted CFs that hinted at this commitment
                                            # Diegetic pre-figurement (story DAs, prior pages) belongs in source_basis.derived_from
                                            # — but per Option A, story-side foreshadowing is captured in `notes` instead;
                                            # only world-canon CF-to-CF foreshadowing populates this field.
